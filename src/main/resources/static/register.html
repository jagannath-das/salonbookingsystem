<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');
*{font-family:'Poppins',sans-serif;}
</style>

</head>

<body class="bg-gray-100 flex justify-center items-center min-h-screen">

<form id="signupForm"
class="bg-white text-gray-600 w-full max-w-[340px] p-6 rounded-lg shadow-lg">

<h2 class="text-2xl font-bold mb-6 text-center text-gray-800">
Register
</h2>

<input id="username"
class="w-full border mb-3 bg-indigo-500/5 border-gray-300 rounded py-2 px-3"
type="text"
placeholder="Username"
required>

<input id="email"
class="w-full border mb-3 bg-indigo-500/5 border-gray-300 rounded py-2 px-3"
type="email"
placeholder="Email"
required>

<input id="password"
class="w-full border mb-6 bg-indigo-500/5 border-gray-300 rounded py-2 px-3"
type="password"
placeholder="Password"
required>

<input id="phoneno"
class="w-full border mb-6 bg-indigo-500/5 border-gray-300 rounded py-2 px-3"
type="phone"
placeholder="Phoneno"
required>

<button type="submit"
class="w-full bg-indigo-500 hover:bg-indigo-600 py-2.5 rounded text-white">
Create Account
</button>

<p class="text-center mt-4">
Already have an account?
<a href="/login.html" class="text-blue-500 underline">
Log In
</a>
</p>

</form>

<script>
document.getElementById("signupForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const user = {
        fullname: document.getElementById("username").value,
        emailid: document.getElementById("email").value,
        password: document.getElementById("password").value,
        phone: document.getElementById("phoneno").value
    };

    try {

        const response = await fetch(
            window.location.origin+"/auth/registeruser",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body: JSON.stringify(user)
            }
        );

        const data = await response.text();

        if(response.ok){
            alert("Registration Successful");
            window.location.href="/login.html";
        } else {
            alert(data);
        }

    } catch(err){
        console.error(err);
        alert("Backend not reachable");
    }
});
</script>

</body>
</html>
