<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Reset Password</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 flex justify-center items-center min-h-screen">

<div class="bg-white p-8 rounded shadow w-96">

<h2 class="text-2xl font-bold text-center mb-6">
Forgot Password
</h2>

<!-- EMAIL -->
<input id="email"
class="w-full border p-2 mb-3 rounded"
placeholder="Enter Email">

<button onclick="sendOtp()"
class="w-full bg-indigo-500 text-white p-2 rounded mb-4">
Send OTP
</button>

<!-- OTP -->
<div id="otpSection" class="hidden">

<input id="otp"
class="w-full border p-2 mb-3 rounded"
placeholder="Enter OTP">

<button onclick="verifyOtp()"
class="w-full bg-green-500 text-white p-2 rounded mb-4">
Verify OTP
</button>

</div>

<!-- RESET PASSWORD -->
<div id="resetSection" class="hidden">

<input id="password"
type="password"
class="w-full border p-2 mb-3 rounded"
placeholder="New Password">

<button onclick="resetPassword()"
class="w-full bg-blue-500 text-white p-2 rounded">
Reset Password
</button>

</div>

</div>

<script>

let userEmail="";

async function sendOtp(){

userEmail=document.getElementById("email").value;

const res = await fetch(window.location.origin+"/forgot-password",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({email:userEmail})
});

alert(await res.text());

document.getElementById("otpSection").classList.remove("hidden");
}

async function verifyOtp(){

const otp=document.getElementById("otp").value;

const res=await fetch(window.location.origin+"/verify-otp",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
email:userEmail,
otp:otp
})
});

const msg=await res.text();
alert(msg);

if(msg==="OTP Verified"){
document.getElementById("resetSection").classList.remove("hidden");
}
}

async function resetPassword(){

const password=document.getElementById("password").value;

const res=await fetch(window.location.origin+"/reset-password",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
email:userEmail,
password:password
})
});

alert(await res.text());

window.location.href="/login.html";
}

</script>

</body>
</html>
