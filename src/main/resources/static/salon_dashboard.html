<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salon Admin Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
*{font-family:Poppins,sans-serif;}
</style>

</head>

<body class="text-white">

<section class="min-h-screen bg-cover bg-center"
style="background-image:url('https://assets.prebuiltui.com/images/components/hero-section/hero-galaxy-bg.png')">

<div class="min-h-screen bg-black/70 p-10">

<h1 class="text-4xl text-center mb-10 font-bold">
Salon Admin Dashboard
</h1>

<div class="max-w-3xl mx-auto mb-6 text-right">
<button onclick="logout()" class="bg-red-600 px-5 py-2 rounded hover:bg-red-700">
Logout
</button>
</div>

<div id="result" class="text-center text-green-400 mb-6"></div>

<div class="bg-white/10 p-6 rounded-xl max-w-3xl mx-auto">

<h2 class="text-xl mb-4">Salon Details</h2>

<input id="salonName" placeholder="Salon Name"
class="w-full mb-2 p-2 text-black rounded">

<input id="email" type="email" placeholder="Email"
class="w-full mb-2 p-2 text-black rounded">

<input id="phone" type="tel" placeholder="Phone"
class="w-full mb-2 p-2 text-black rounded">

<input id="location" placeholder="Location"
class="w-full mb-4 p-2 text-black rounded">

<div class="grid md:grid-cols-2 gap-3 mb-4">
<div>
<label class="block mb-1">Opening Time</label>
<input type="time" id="openingtime" required
class="w-full p-2 text-black rounded">
</div>

<div>
<label class="block mb-1">Closing Time</label>
<input type="time" id="closingtime" required
class="w-full p-2 text-black rounded">
</div>
</div>

<label>Salon Image</label>
<input type="file" id="salonImage" class="mb-6">


<h2 class="text-xl mb-4">Services</h2>

<div id="servicesContainer"></div>

<button onclick="addServiceField()"
class="bg-blue-600 px-4 py-2 rounded mb-6">
+ Add Service
</button>

<br>

<button onclick="createSalonWithServices()"
class="bg-purple-600 px-8 py-3 rounded">
Create Salon With Services
</button>

</div>

<div class="bg-white/10 p-6 rounded-xl max-w-3xl mx-auto mt-8">

<h2 class="text-xl mb-4">Add Service To Existing Salon</h2>

<input id="selectedSalonId" type="hidden">

<button onclick="loadSalonChoices()"
class="bg-blue-600 px-4 py-2 rounded mb-4 hover:bg-blue-700">
Choose Salon
</button>

<div id="selectedSalonText" class="mb-3 text-white/80">
No salon selected
</div>

<div id="salonChoices" class="grid md:grid-cols-2 gap-3 mb-5"></div>

<input id="existingServiceName" placeholder="Service Name"
class="w-full mb-2 p-2 text-black rounded">

<input id="existingServiceCost" type="number" min="0" step="0.01" placeholder="Price"
class="w-full mb-2 p-2 text-black rounded">

<label>Service Image</label>
<input type="file" id="existingServiceImage" class="block mb-6">

<button onclick="addServiceToExistingSalon()"
class="bg-green-600 px-8 py-3 rounded hover:bg-green-700">
Add Service To Existing Salon
</button>

</div>
</div>
</section>

<script>

const result=document.getElementById("result");
const token=localStorage.getItem("token");

if(!token){
window.location.href="login.html";
}

function logout(){
localStorage.removeItem("token");
localStorage.removeItem("userId");
localStorage.removeItem("role");
window.location.href="login.html";
}

function getValue(id){
return document.getElementById(id).value.trim();
}

function imageSrc(path){
if(!path){
return "https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=300&q=80";
}
return path.startsWith("http") ? path : window.location.origin+path;
}

async function uploadImage(file){

if(!file) return "";

let formData=new FormData();
formData.append("file",file);

let res=await fetch(window.location.origin+"/upload",{
method:"POST",
headers:{
Authorization:"Bearer "+token
},
body:formData
});

let text=await res.text();
if(!res.ok){
throw new Error(text || "Image upload failed");
}
return text;
}

function addServiceField(){

let div=document.createElement("div");

div.className="mb-4 border p-3 rounded";

div.innerHTML=`
<input placeholder="Service Name"
class="serviceName w-full mb-2 p-2 text-black rounded">

<input placeholder="Price"
type="number" min="0" step="0.01"
class="serviceCost w-full mb-2 p-2 text-black rounded">

<label>Service Image</label>
<input type="file" class="serviceImage">
`;

document.getElementById("servicesContainer").appendChild(div);
}

async function fetchJSON(url,options){

let res=await fetch(url,options);
let text=await res.text();

if(!res.ok){
throw new Error(text || "Request failed: "+res.status);
}

if(!text){
return {};
}

try{
return JSON.parse(text);
}catch{
throw new Error(text || "Invalid response from "+url);
}
}

async function fetchText(url,options){
let res=await fetch(url,options);
let text=await res.text();
if(!res.ok){
throw new Error(text || "Request failed: "+res.status);
}
return text;
}

async function createSalonWithServices(){

try{

result.innerHTML="Creating salon...";

const salonName=getValue("salonName");
const email=getValue("email");
const phone=getValue("phone");
const location=getValue("location");
const openingtime=getValue("openingtime");
const closingtime=getValue("closingtime");

if(!salonName || !email || !phone || !location || !openingtime || !closingtime){
throw new Error("Enter salon name, email, phone, location, opening time and closing time");
}

let salonImageUrl=
await uploadImage(
document.getElementById("salonImage").files[0]
);

let salon=await fetchJSON(
window.location.origin+"/salon/addsalon",
{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({
name:salonName,
email:email,
phone:phone,
location:location,
openingtime:openingtime,
closingtime:closingtime,
imageUrl:salonImageUrl
})
});

let salonId=salon && salon.id;

if(!salonId){
throw new Error("Salon was not created correctly");
}

salonId=Number(salonId);

if(Number.isNaN(salonId) || salonId<=0){
throw new Error("Salon id was not returned correctly");
}

let names=document.querySelectorAll(".serviceName");
let costs=document.querySelectorAll(".serviceCost");
let images=document.querySelectorAll(".serviceImage");

if(names.length===0){
throw new Error("Add at least one service");
}

for(let i=0;i<names.length;i++){

const serviceName=names[i].value.trim();
const serviceCost=Number(costs[i].value);

if(!serviceName || costs[i].value===""){
throw new Error("Enter service name and price");
}

if(Number.isNaN(serviceCost) || serviceCost<0){
throw new Error("Service price must be a valid non-negative number");
}

let service=await fetchJSON(
window.location.origin+"/salon/addservices",
{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({
name:serviceName
})
});

if(!service || !service.id){
throw new Error("Service was not created correctly");
}

let imageUrl=await uploadImage(images[i].files[0]);

await fetchText(
window.location.origin+"/salon/addsalonservicesui",
{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({
salonid:Number(salonId),
servicesid:Number(service.id),
cost:serviceCost,
imageUrl:imageUrl
})
});

}

result.innerHTML="Salon and services created successfully";

}catch(err){

console.error(err);
result.innerHTML="Error: "+err.message;
alert(err.message);

}

}

async function addServiceToExistingSalon(){

try{

result.innerHTML="Adding service...";

const salonId=getValue("selectedSalonId");
const serviceName=getValue("existingServiceName");
const serviceCostText=getValue("existingServiceCost");
const serviceCost=Number(serviceCostText);

if(!salonId || !serviceName || serviceCostText===""){
throw new Error("Choose salon, enter service name and price");
}

if(Number.isNaN(serviceCost) || serviceCost<0){
throw new Error("Service price must be a valid non-negative number");
}

let service=await fetchJSON(
window.location.origin+"/salon/addservices",
{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({
name:serviceName
})
});

if(!service || !service.id){
throw new Error("Service was not created correctly");
}

let imageUrl=await uploadImage(
document.getElementById("existingServiceImage").files[0]
);

await fetchText(
window.location.origin+"/salon/addsalonservicesui",
{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({
salonid:Number(salonId),
servicesid:Number(service.id),
cost:serviceCost,
imageUrl:imageUrl
})
});

result.innerHTML="Service added successfully";
document.getElementById("existingServiceName").value="";
document.getElementById("existingServiceCost").value="";
document.getElementById("existingServiceImage").value="";

}catch(err){

console.error(err);
result.innerHTML="Error: "+err.message;
alert(err.message);

}

}

async function loadSalonChoices(){

try{

const res=await fetch(window.location.origin+"/salon/getallsalons",{
headers:{Authorization:"Bearer "+token}
});

if(!res.ok){
throw new Error("Unable to load salons");
}

const salons=await res.json();

document.getElementById("salonChoices").innerHTML=salons.map(salon=>`
<button type="button" onclick="selectExistingSalon('${salon.id}','${salon.name ?? ""}','${salon.location ?? ""}')"
class="text-left bg-white/10 rounded p-3 hover:bg-white/20 border border-white/10">
<img src="${imageSrc(salon.imageUrl)}" alt="${salon.name ?? "Salon"}"
class="w-full h-28 object-cover rounded mb-2">
<span class="block font-semibold">${salon.name ?? "Salon"}</span>
<span class="block text-sm text-white/70">${salon.location ?? "Location not available"}</span>
</button>
`).join("") || "<div class='text-white/70'>No salons found</div>";

}catch(err){

console.error(err);
alert(err.message);

}

}

function selectExistingSalon(id,name,location){
document.getElementById("selectedSalonId").value=id;
document.getElementById("selectedSalonText").innerText=`Selected: ${name} - ${location}`;
}

addServiceField();
loadSalonChoices();

</script>

</body>
</html>
