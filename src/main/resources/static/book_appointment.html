<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book Appointment</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="text-white">

<section class="min-h-screen flex flex-col items-center justify-center
bg-cover bg-center"
style="background-image:url('https://assets.prebuiltui.com/images/components/hero-section/hero-galaxy-bg.png')">

<h2 class="text-4xl mb-8">Book Appointment</h2>

<div class="flex flex-col gap-4 w-full max-w-3xl px-4">

<div class="flex gap-3">
<input id="location" placeholder="Search salon by location" class="text-black p-2 rounded flex-1">
<button onclick="searchSalons()" class="bg-purple-700 px-4 rounded">Search</button>
</div>

<div id="salons" class="grid gap-4"></div>

<input id="serviceid" placeholder="Selected Salon Service ID" class="text-black p-2 rounded" readonly>
<input type="date" id="date" class="text-black p-2 rounded">
<input type="time" id="time" class="text-black p-2 rounded">

<button onclick="book()" class="bg-indigo-600 p-3 rounded">
Book Appointment
</button>

<a href="user_dashboard.html" class="text-center mt-3 underline">
Back
</a>

</div>

</section>

<script>

const APP_BASE=window.location.origin;
const BASE=APP_BASE+"/user";
const token=localStorage.getItem("token");
let userId=localStorage.getItem("userId");

function imageSrc(path){
if(!path){
return "https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=400&q=80";
}
return path.startsWith("http") ? path : APP_BASE+path;
}

if(!token){
window.location.href="login.html";
}

if(!userId && token){
try{
const payload=JSON.parse(atob(token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
userId=payload.id;
localStorage.setItem("userId",userId);
}catch(e){}
}

async function book(){

const selectedService=document.getElementById("serviceid").value;
const selectedDate=document.getElementById("date").value;
const selectedTime=document.getElementById("time").value;

if(!selectedService || !selectedDate || !selectedTime){
alert("Enter service, date and time");
return;
}

if(!userId){
alert("Login again");
window.location.href="login.html";
return;
}

const res=await fetch(BASE+"/bookappointmentui",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({
userid:userId,
salonservicesid:selectedService,
appointmentDate:selectedDate,
appointmentTime:selectedTime.length === 5 ? selectedTime + ":00" : selectedTime,
status:"BOOKED"
})
});

const text=await res.text();

if(res.ok){
alert(text);
window.location.href="appointments.html";
}else{
alert(text || "Appointment booking failed");
}
}

async function searchSalons(){

const locationValue=document.getElementById("location").value.trim();

if(!locationValue){
alert("Enter location");
return;
}

const res=await fetch(APP_BASE+"/salon/findsalon/"+encodeURIComponent(locationValue),{
headers:{Authorization:"Bearer "+token}
});

if(!res.ok){
alert("Unable to load salons");
return;
}

const list=await res.json();
let html="";

for(const salon of list){
const serviceRes=await fetch(APP_BASE+"/salon/getsalonservices/salonid/"+salon.id,{
headers:{Authorization:"Bearer "+token}
});
const services=serviceRes.ok ? await serviceRes.json() : [];
html+=`
<div class="bg-black/50 p-4 rounded text-left">
<div class="flex flex-col md:flex-row gap-4">
<img src="${imageSrc(salon.imageUrl)}" alt="${salon.name ?? "Salon"}"
class="w-full md:w-44 h-32 object-cover rounded">
<div class="flex-1">
<div class="font-semibold text-xl">${salon.name}</div>
<div class="text-sm text-white/80">${salon.location ?? "Location not available"}</div>
<div class="text-sm text-white/70">Open: ${salon.openingtime ?? "N/A"} - ${salon.closingtime ?? "N/A"}</div>
<div class="mt-2 grid gap-2">
${services.map(s=>`
<button class="text-left bg-white/10 p-2 rounded hover:bg-white/20 flex gap-3 items-center"
onclick="selectService('${s.id}')">
<img src="${imageSrc(s.imageUrl || salon.imageUrl)}" alt="${s.services?.name ?? "Service"}"
class="w-16 h-16 object-cover rounded">
<span>
<span class="block font-semibold">${s.services?.name ?? "Service"}</span>
<span class="block text-sm text-white/80">Rs. ${s.cost ?? ""}</span>
<span class="block text-xs text-white/60">Salon Service ID: ${s.id}</span>
</span>
</button>
`).join("")}
</div>
</div>
</div>
</div>`;
}

salons.innerHTML=html || "<div class='bg-black/50 p-4 rounded'>No salons found</div>";
}

function selectService(id){
document.getElementById("serviceid").value=id;
}

</script>

</body>
</html>
